[package]
name = "hirpuscity"
version = "1.0.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
mime_guess = "2"
percent-encoding = "2"

[profile.release]
strip = true
lto = true
